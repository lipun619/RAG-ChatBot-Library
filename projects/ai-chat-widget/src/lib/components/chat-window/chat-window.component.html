<div class="ai-chat-backdrop" (click)="close.emit()"></div>

<div class="ai-chat-window" [class.ai-chat-window--expanded]="isExpanded()" @chatWindowAnimation>
  <!-- Mobile drag handle -->
  <div class="ai-chat-drag-handle">
    <div class="ai-chat-drag-bar"></div>
  </div>

  <!-- Header -->
  <div class="ai-chat-header">
    <div class="ai-chat-header-left">
      <div class="ai-chat-status-dot"></div>
      <h2 class="ai-chat-title">{{ title() }}</h2>
    </div>
    <div class="ai-chat-header-actions">
    <button
      class="ai-chat-expand-btn"
      (click)="toggleExpand()"
      [attr.aria-label]="isExpanded() ? 'Collapse chat' : 'Expand chat'"
    >
      @if (isExpanded()) {
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 14 10 14 10 20" />
          <polyline points="20 10 14 10 14 4" />
          <line x1="14" y1="10" x2="21" y2="3" />
          <line x1="3" y1="21" x2="10" y2="14" />
        </svg>
      } @else {
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 3 21 3 21 9" />
          <polyline points="9 21 3 21 3 15" />
          <line x1="21" y1="3" x2="14" y2="10" />
          <line x1="3" y1="21" x2="10" y2="14" />
        </svg>
      }
    </button>
    <button
      class="ai-chat-close-btn"
      (click)="close.emit()"
      aria-label="Close chat"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <line x1="18" y1="6" x2="6" y2="18" />
        <line x1="6" y1="6" x2="18" y2="18" />
      </svg>
    </button>
    </div>
  </div>

  <!-- Messages -->
  <div class="ai-chat-messages" #messagesContainer>
    @if (messages().length === 0) {
      <!-- Welcome -->
      <div class="ai-chat-welcome">
        <span class="ai-chat-welcome-label">&gt; system</span>
        <p class="ai-chat-welcome-text">{{ welcomeMessage() }}</p>
      </div>

      <!-- Suggestions -->
      @if (suggestedQuestions().length > 0) {
        <div class="ai-chat-suggestions">
          <p class="ai-chat-suggestions-label">Try asking:</p>
          <div class="ai-chat-suggestions-list">
            @for (q of suggestedQuestions(); track q) {
              <button
                class="ai-chat-suggestion-btn"
                (click)="sendSuggestion(q)"
              >
                {{ q }}
              </button>
            }
          </div>
        </div>
      }
    } @else {
      @for (msg of messages(); track msg.id) {
        <ai-chat-message [message]="msg" />
      }
    }


  </div>

  <!-- Input -->
  <div class="ai-chat-input-area">
    <div class="ai-chat-input-row">
      <input
        class="ai-chat-input"
        type="text"
        [placeholder]="placeholder()"
        [(ngModel)]="userInput"
        (keydown.enter)="send()"
        [disabled]="isLoading()"
      />
      <button
        class="ai-chat-send-btn"
        (click)="send()"
        [disabled]="isLoading() || !userInput.trim()"
        aria-label="Send message"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="22" y1="2" x2="11" y2="13" />
          <polygon points="22 2 15 22 11 13 2 9 22 2" />
        </svg>
      </button>
    </div>
    <p class="ai-chat-disclaimer">AI-generated — verify important info</p>
  </div>
</div>
